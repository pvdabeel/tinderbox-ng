# /etc/portage/env/tinderbox-ng-no-rbql.conf -- shipped by tinderbox-ng
# bootstrap; wired to kde-apps/kate-addons via package.env.
#
# Skip the rbql addon: its CMakeLists links Qt::Qml without any
# find_package(Qt6Qml) in scope, so the cmake generate step always fails
# (portage-ng#98). MYCMAKEARGS is appended after the ebuild's own
# mycmakeargs by cmake.eclass, so this override wins.
MYCMAKEARGS="-DBUILD_rbql=OFF"
